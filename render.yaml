services:
  - type: web
    name: grant-automation-api
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4006
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        scope: backend
      - key: CLAUDE_API_KEY
        scope: backend
      - key: GEMINI_API_KEY
        scope: backend
      - key: ALLOWED_ORIGINS
        value: https://grant-automation-saas.vercel.app
      - key: LOG_LEVEL
        value: info
